services:
  - type: web
    name: incovall-ini
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter          # mínimo que incluye disco persistente

    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render genera un valor aleatorio seguro
      - key: DATABASE_PATH
        value: /data/inspecciones.db
      - key: FOTOS_PATH
        value: /data/fotos

    disk:
      name: incovall-data
      mountPath: /data
      sizeGB: 1
