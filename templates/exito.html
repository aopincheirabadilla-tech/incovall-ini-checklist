{% extends "base.html" %}
{% block title %}Guardado Exitoso – INCOVALL{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow text-center border-0">
      <div class="card-body py-5 px-4">
        <div class="mb-3" style="font-size:4rem; color:#2e7d32;">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h2 class="fw-bold mb-1">¡Inspección Guardada!</h2>
        <p class="text-muted mb-1">Correlativo</p>
        <h4 class="fw-bold text-primary mb-4">{{ insp['correlativo'] }}</h4>
        <p class="text-muted mb-4">
          Recinto: <strong>{{ insp['nombre_recinto'] }}</strong>
        </p>

        <a href="/pdf/{{ inspeccion_id }}"
           class="btn btn-primary btn-xl w-100 mb-3 fw-bold">
          <i class="bi bi-file-earmark-pdf"></i> &nbsp;Descargar PDF
        </a>
        <a href="/" class="btn btn-outline-secondary w-100 mb-2">
          <i class="bi bi-plus-circle"></i> &nbsp;Nueva Inspección
        </a>
        <a href="/historial" class="btn btn-outline-secondary w-100">
          <i class="bi bi-clock-history"></i> &nbsp;Ver Historial
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
