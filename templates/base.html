<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}INCOVALL – Inspección INI{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark sticky-top" style="background:#0d47a1;">
  <div class="container-fluid px-2 px-md-3">

    <!-- Logo INCOVALL (izquierda) -->
    <a href="/" class="nav-logo-link flex-shrink-0">
      <img src="{{ url_for('static', filename='logo_incovall.png') }}"
           alt="INCOVALL"
           class="nav-logo"
           onerror="this.style.display='none'; document.getElementById('fb-incovall').style.display='flex';">
      <div id="fb-incovall" class="logo-fallback" style="display:none;">
        <div class="logo-badge">IN</div>
        <span class="text-white fw-bold ms-1 d-none d-sm-inline">INCOVALL</span>
      </div>
    </a>

    <!-- Título central -->
    <div class="nav-title-center text-white text-center flex-grow-1 px-2">
      <div class="fw-bold lh-1" style="font-size:0.95rem;">Inspección Preventiva INI</div>
      <div class="opacity-75 lh-1 mt-1" style="font-size:0.7rem;">INCO-INI-VH-001</div>
    </div>

    <!-- Logo CMP (derecha) + botones de navegación -->
    <div class="d-flex align-items-center gap-2 flex-shrink-0">
      <img src="{{ url_for('static', filename='logo_cmp.png') }}"
           alt="CMP"
           class="nav-logo"
           onerror="this.style.display='none'; document.getElementById('fb-cmp').style.display='flex';">
      <div id="fb-cmp" class="logo-fallback" style="display:none;">
        <span class="text-white fw-bold" style="font-size:0.85rem;">CMP</span>
      </div>
      <div class="vr bg-white opacity-25 mx-1 d-none d-sm-block" style="height:32px;"></div>
      <a href="/" class="btn btn-outline-light btn-sm">
        <i class="bi bi-plus-circle"></i> <span class="d-none d-md-inline">Nueva</span>
      </a>
      <a href="/historial" class="btn btn-outline-light btn-sm">
        <i class="bi bi-clock-history"></i> <span class="d-none d-md-inline">Historial</span>
      </a>
    </div>

  </div>
</nav>

<!-- Content -->
<main class="container-fluid py-3 px-2 px-md-4">
  {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="text-center text-muted small py-3 mt-4 border-top">
  INCOVALL &nbsp;·&nbsp; Formulario INCO-INI-VH-001
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
